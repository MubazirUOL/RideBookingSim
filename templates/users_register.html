{% extends "base.html" %}
{% block title %}RIDE SIM — Register User{% endblock %}
{% block page_header %}
<div class="rx-page-header">
  <div class="rx-page-header-inner">
    <div><div class="rx-page-eyebrow">// USER MANAGEMENT</div>
    <h1 class="rx-page-title">REGISTER <span class="rx-accent">USER</span></h1></div>
  </div>
</div>
{% endblock %}
{% block content %}
<div class="rx-form-section rx-animate">
  <form method="POST">
    <div class="mb-4">
      <label class="rx-field-label">USER ID</label>
      <input type="number" name="userId" class="rx-input" placeholder="e.g. 1" required />
    </div>
    <div class="mb-4">
      <label class="rx-field-label">FULL NAME</label>
      <input type="text" name="name" class="rx-input" placeholder="e.g. Ahmad Raza" required />
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="rx-btn rx-btn-primary"><i class="bi bi-person-check"></i> REGISTER</button>
      <a href="{{ url_for('users_list') }}" class="rx-btn rx-btn-ghost">BACK</a>
    </div>
  </form>
</div>
{% endblock %}
