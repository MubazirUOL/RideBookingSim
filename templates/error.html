{% extends "base.html" %}
{% block title %}RIDE SIM — Error {{ code }}{% endblock %}
{% block content %}
<div class="rx-empty" style="min-height:50vh; display:flex; flex-direction:column; align-items:center; justify-content:center">
  <div class="rx-display rx-amber" style="font-size:6rem; line-height:1">{{ code }}</div>
  <div class="rx-empty-title mt-2">{{ message }}</div>
  <div class="d-flex gap-2 mt-4">
    <a href="{{ url_for('home') }}" class="rx-btn rx-btn-primary"><i class="bi bi-house"></i> HOME</a>
    <a href="javascript:history.back()" class="rx-btn rx-btn-ghost">GO BACK</a>
  </div>
</div>
{% endblock %}
